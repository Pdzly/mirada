name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libxkbcommon0 libgl1
      - name: Instalar
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
      - name: Construir paquete
        run: |
          pip install build
          python -m build
